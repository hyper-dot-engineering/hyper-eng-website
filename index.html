<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper Engineering | AI Native Engineering</title>
    <meta name="description" content="AI Native Engineering. We build AI agents. Sometimes for you.">
    <meta property="og:title" content="Hyper Engineering">
    <meta property="og:description" content="AI Native Engineering. We build AI agents. Sometimes for you.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hyper.engineering">
    <link rel="icon" type="image/png" href="assets/main-s.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #999;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            line-height: 1.6;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(59,130,246,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.05) 0%, transparent 70%);
            pointer-events: none;
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .container {
            max-width: 600px;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .logo {
            width: 300px;
            height: auto;
            margin-bottom: 2rem;
            opacity: 0.95;
            filter: drop-shadow(0 0 40px rgba(59,130,246,0.2));
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
        }

        .dot {
            color: #3b82f6;
        }

        .tagline {
            font-size: 1.1rem;
            color: #666;
            margin-top: -0.25rem;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .pitch {
            font-size: 1.35rem;
            color: #ccc;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        a {
            color: #3b82f6;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #fff;
        }

        .cta {
            font-size: 1.1rem;
        }

        footer {
            margin-top: 4rem;
            padding-top: 1.5rem;
            border-top: 1px solid #1a1a1a;
            color: #444;
            font-size: 0.875rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.75rem;
            }
            .tagline {
                font-size: 0.9rem;
            }
            .logo {
                width: 200px;
            }
            .pitch {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/logo-light-transparent.png" alt="Hyper" class="logo">
        <h1>hyper<span class="dot">.</span>engineering</h1>
        <p class="tagline">AI Native Engineering</p>

        <p class="pitch">We build AI agents. Sometimes for you.</p>

        <p class="cta"><a href="mailto:hello@hyper.engineering">hello@hyper.engineering</a></p>

        <footer>&copy; 2026 Hyper Engineering</footer>
    </div>
</body>
</html>
